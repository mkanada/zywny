<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Estude partituras ao piano com o teclado MIDI.">
  <meta name="theme-color" content="#5A1E2B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="zywny">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>zywny</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    O flutter_midi_command_web pede `requestMIDIAccess({sysex: true})`, que
    abre a pergunta mais assustadora do Chrome ("controlar e reprogramar seus
    dispositivos MIDI"). O zywny só lê notas e manda notas: sem sysex.
  -->
  <script>
    if (navigator.requestMIDIAccess) {
      const requestMIDIAccess = navigator.requestMIDIAccess.bind(navigator);
      navigator.requestMIDIAccess = (options) =>
          requestMIDIAccess({...options, sysex: false});
    }
  </script>
  <!--
    PWA: o sw.js guarda o app para abrir sem internet (só na versão
    publicada; ver web/sw.js e tool/publish_web.sh).
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) =>
            console.warn('service worker não registrou:', e));
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
